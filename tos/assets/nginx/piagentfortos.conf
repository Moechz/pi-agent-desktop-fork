# Pi Agent for TOS —— nginx 反代（新版标签页 External Open 模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/piagentfortos/nginx/piagentfortos.conf
# 平台会把它加载进 TOS nginx；location 前缀必须与 config.ini 的 path 一致。
#
# 关键：本应用以 **前缀保留** 方式运行（构建期 basePath=/piagentfortos），
# 因此 proxy_pass **不能**带尾斜杠——带了会剥掉前缀，应用收不到带前缀的请求，
# 前端资源与 API 全部 404（对照 kavita 的同款方案）。
# 精确匹配（**必须**）：Next 的 basePath 规范形式不带尾斜杠，
# 应用会把 /piagentfortos/ → 308 → /piagentfortos；若不单独匹配该形式，
# 请求会落到平台层的"补斜杠"逻辑，与应用互相重定向形成死循环（真机实测）。
location = /piagentfortos {
    proxy_pass http://127.0.0.1:18141;
    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;
}

# ★ ^~ 前缀匹配：**优先级高于正则 location** —— 必须带！
# 原因（2026-09-29 真机实证，坑 65）：TOS「应用访问控制」会生成
#   location ~ ^/piagentfortos/(.*) { auth_request …; try_files $uri $uri/ =404; }   ← 正则
# 按 nginx 规则「精确 = → ^~ 前缀 → 正则 ~ → 普通前缀」，**正则赢过普通前缀**：
# 请求进不了本段反代，而是落到 try_files 去 /usr/www/piagentfortos/ 找静态文件
# → 未登录 302 到桌面、已登录直接显示落地页（200），应用永远打不开。
# 加 ^~ 后本段胜出，且即使平台再生成那份访问控制文件也不会被挡。
# 代价：本应用**不再要求 TOS 登录**（与团队其余 7 个应用一致；如需登录保护，
# 平台那套模板与本反向代理无法共存，只能报平台缺陷）。
location ^~ /piagentfortos/ {
    proxy_pass http://127.0.0.1:18141;
    # 缓存头由应用自己下发（next.config.ts 的 headers()），这里**不要**再 add_header Cache-Control：
    # 重复的 Cache-Control 会让浏览器行为不确定。应用已保证：
    #   文档/接口 → no-cache, must-revalidate（升级后不会吃旧页面）
    #   /_next/static/* → immutable（带内容哈希，可长期缓存）
    # 应用自身 301 跳转不丢 :8181 端口（坑 13）
    absolute_redirect off;
    proxy_http_version 1.1;
    # 含端口：应用会据此生成绝对 URL（坑 14）
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（当前主要走 SSE，留作兼容）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 智能体输出是长连接流式（SSE）：必须关闭响应缓冲，否则界面会"憋住不吐字"
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    # 智能体单次工具执行可能很久（构建/长命令），读超时放宽
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 图片附件等上传
    client_max_body_size 64m;
}

# 隐私政策（C3 合规资产：必须可被用户找到，且用相对链接在两种部署下都成立）
location = /piagentfortos/privacy-policy.html {
    alias /usr/local/piagentfortos/privacy-policy.html;
}
