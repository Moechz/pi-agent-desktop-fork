name: TOS packages

# Pi Agent for TOS —— 双架构 deb 构建
#   推 tag `tos-v*` → 构建并发布到 GitHub Release
#   手动触发    → 只上传 artifact（不发 Release）
#
# 架构与 runner 选型：
#   amd64 → ubuntu-22.04（glibc 2.35 = TOS 7 基座，天然对齐）
#   arm64 → ubuntu-22.04-arm（同上；若该标签在某账号不可用，改成 ubuntu-24.04-arm，
#           构建末尾的 glibc ≤ 2.35 门禁会拦住任何不兼容产物）

on:
  push:
    tags:
      - "tos-v*"
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构"
        type: choice
        options: [both, amd64, arm64]
        default: both

permissions:
  contents: write

concurrency:
  group: tos-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: 过滤手动触发的架构选择
        id: gate
        run: |
          set -euo pipefail
          want="${{ github.event.inputs.arch || 'both' }}"
          arch="${{ matrix.arch }}"
          if [ "$want" = "both" ] || [ "$want" = "$arch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "跳过 $arch（手动触发仅要求 $want）"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == '1'
        with:
          node-version: "24"

      - name: 依赖安装（含目标平台原生模块：sharp / pi-tui）
        if: steps.gate.outputs.run == '1'
        run: npm ci

      - name: 构建应用本体（TOS 子路径 basePath）
        if: steps.gate.outputs.run == '1'
        env:
          TOS_BASE_PATH: /piagentfortos
        run: npm run build:standalone:linux

      - name: 组装 deb（运行时按 sha256 pin 校验 + 规范断言 + glibc 门禁）
        if: steps.gate.outputs.run == '1'
        run: bash tos/build.sh --standalone .next/standalone --arch ${{ matrix.arch }}

      - name: 结构复核（ar 成员 / control / 关键文件）
        if: steps.gate.outputs.run == '1'
        run: |
          set -euo pipefail
          DEB="$(ls tos/dist/*.deb)"
          echo "== $DEB =="
          test -f "$DEB.sha256"

          # 注意：set -o pipefail 下 `tar … | grep -q` 会因 grep 提前退出给 tar 发 SIGPIPE
          # 造成 "tar: stdout: write error" 假失败（指南坑 33）——一律先落清单再查。
          ar t "$DEB" > members.txt
          members="$(tr '\n' ' ' < members.txt)"
          echo "ar 成员: $members"
          for m in debian-binary control.tar.gz data.tar.xz; do
            grep -qx "$m" members.txt || { echo "缺少成员 $m"; exit 1; }
          done

          mkdir -p /tmp/debcheck && cd /tmp/debcheck && rm -rf ./*
          ar x "$OLDPWD/$DEB"
          tar xzf control.tar.gz -O ./control > control.txt
          head -8 control.txt
          grep -q '^Package: piagentfortos$' control.txt
          grep -q '^Architecture: ${{ matrix.arch }}$' control.txt
          # git 必须是 Recommends：真机实测 TOS 预装 git 常无 dpkg 数据库记录，
          # 声明硬 Depends 会让 dpkg 卡在配置阶段（状态 iU）导致安装失败。
          grep -q '^Recommends: git' control.txt
          ! grep -q '^Depends: .*git' control.txt

          tar tJf data.tar.xz > data-list.txt
          for f in \
            ./usr/local/piagentfortos/bin/node \
            ./usr/local/piagentfortos/standalone/server.js \
            ./usr/local/piagentfortos/config.ini \
            ./usr/local/piagentfortos/piagentfortos.lang \
            ./usr/local/piagentfortos/images/icons/piagentfortos.svg \
            ./usr/local/piagentfortos/PROVENANCE.md \
            ./usr/local/piagentfortos/BUILD-INFO \
            ./usr/local/piagentfortos/webui.bz2 \
            ./etc/systemd/system/piagentfortos.service \
            ./etc/nginx/conf.d/piagentfortos.conf ; do
            grep -qx "$f" data-list.txt || { echo "data 包缺少 $f"; exit 1; }
          done

          # 权限门禁（坑 57）：包内文件必须对非 root 运行用户可读、目录可遍历。
          # 构建环境 umask 与源树权限会经 cp -R 原样进包（027 → 0640/0750），
          # 真机上运行用户读不到自己的 package.json → 服务秒退、应用中心卡「安装中」。
          mkdir -p /tmp/debdata && rm -rf /tmp/debdata/* && tar xJf data.tar.xz -C /tmp/debdata
          bad="$(find /tmp/debdata -type f ! -perm -o=r -print -quit)"
          [ -z "$bad" ] || { echo "❌ 包内文件对其它用户不可读：$bad"; exit 1; }
          bad="$(find /tmp/debdata -type d ! -perm -o=rx -print -quit)"
          [ -z "$bad" ] || { echo "❌ 包内目录不可被其它用户遍历：$bad"; exit 1; }
          echo "✓ 权限门禁通过（文件 o+r / 目录 o+rx）"
          echo "结构复核通过"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == '1'
        with:
          name: tos-deb-${{ matrix.arch }}
          path: |
            tos/dist/*.deb
            tos/dist/*.sha256
          if-no-files-found: error

  release:
    name: upload TOS Release
    if: startsWith(github.ref, 'refs/tags/tos-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tos-deb-*
          path: dist-artifacts
          merge-multiple: true
      - name: 上传资产到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -la dist-artifacts
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "Pi Agent for TOS ${tag#tos-}" \
              --notes "TOS 应用中心包（deb）。校验值见随附 .sha256 文件。"
          fi
          gh release upload "$tag" dist-artifacts/*.deb dist-artifacts/*.sha256 --clobber
          gh release view "$tag" --json assets -q '.assets[] | .name + "  " + (.size|tostring)'
