name: CI

# ★ 触发分支必须包含 custom/main：本仓库**所有开发都在 custom/main**（main 只跟随上游，
# 从不提交）。2026-09-30 之前这里只写 [main] → 这套 lint/typecheck/test（含 Windows/macOS 任务）
# **事实上从未在本仓库的开发分支上跑过**；协作者在 Windows 上手工跑全量才发现了 3 个
# "只在 Windows 复现"的测试失败（PR #1）。勿再改回只写 main。
on:
  pull_request:
    branches: [main, custom/main]
  push:
    branches: [main, custom/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        timeout-minutes: 5
        run: npm test

  build:
    name: build (next.js)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        run: npm run build

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Electron
        run: npm run build:electron

      - name: Check packaged updater dependencies
        run: npm run check:electron-deps

      - name: Test (Windows)
        timeout-minutes: 10
        shell: bash
        run: npm run test:windows

  test-macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Electron
        run: npm run build:electron

      - name: Check packaged updater dependencies
        run: npm run check:electron-deps

      - name: Test (macOS)
        timeout-minutes: 10
        run: npm run test:macos
